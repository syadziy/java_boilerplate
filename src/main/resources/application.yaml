spring:
  application:
    name: java-boilerplate
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # =========================
  # DATABASE
  # =========================
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/java_boilerplate}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin_macbook}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: centralized-alert-pool
      connection-init-sql: SET TIME ZONE 'UTC'
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000

  # =========================
  # FLYWAY
  # =========================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true

  # =========================
  # REDIS
  # =========================
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

    # =========================
    # MONGODB
    # =========================
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/java_boilerplate}
      auto-index-creation: true

    # =========================
    # ELASTICSEARCH
    # =========================
    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: ${ELASTICSEARCH_CONNECTION_TIMEOUT:2s}
    socket-timeout: ${ELASTICSEARCH_SOCKET_TIMEOUT:5s}

  # =========================
  # KAFKA
  # =========================
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:java-boilerplate}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.mac.boilerplate.entities.dto
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # =========================
  # VIRTUAL THREADS
  # =========================
  threads:
    virtual:
      enabled: true

# =========================
# SERVER
# =========================
server:
  port: ${SERVER_PORT:9010}

# =========================
# TASK CONFIG
# =========================
task:
  cache:
    enabled: ${TASK_CACHE_ENABLED:true}
    ttl: ${TASK_CACHE_TTL:10m}
  cleanup:
    enabled: ${TASK_CLEANUP_ENABLED:true}
    cron: ${TASK_CLEANUP_CRON:0 0 2 * * *}
    retention: ${TASK_CLEANUP_RETENTION:30d}
  kafka:
    enabled: ${TASK_KAFKA_ENABLED:true}
    create-topic: ${TASK_KAFKA_CREATE_TOPIC:task.create}
    dead-letter-topic: ${TASK_KAFKA_DLT_TOPIC:task.create.dlt}
    retry-interval-ms: ${TASK_KAFKA_RETRY_INTERVAL_MS:1000}
    max-retries: ${TASK_KAFKA_MAX_RETRIES:2}
  reporting:
    cache-ttl: ${TASK_REPORTING_CACHE_TTL:5m}
    default-window: ${TASK_REPORTING_DEFAULT_WINDOW:P30D}
    elastic-index: ${TASK_SEARCH_INDEX:task-search}
    audit-collection: ${TASK_AUDIT_COLLECTION:task_audit}

# =========================
# SHARED SDK
# =========================
sdk:
  timezone: ${APP_TIMEZONE:UTC}
  web:
    exception-handler:
      enabled: true
  logging:
    structured:
      enabled: true
      format: ecs
      auto-configure-format: true
      trace-header: X-Correlation-Id
      trace-response-header: true
    aspect:
      enabled: true
      packages: com.mac.java_boilerplate.service,com.mac.java_boilerplate.repository
  security:
    enabled: ${SDK_SECURITY_ENABLED:true}
    csrf-disabled: true
    jwt-issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:9005}
    session-creation-policy: STATELESS
    # permit-all-paths:
    #   - /internal/**
    #   - /actuator/health/**
    #   - /actuator/info/**
    #   - /v3/api-docs/**
    #   - /swagger-ui.html
    #   - /swagger-ui/**
    #   - /error
    method-security-enabled: ${SDK_METHOD_SECURITY_ENABLED:true}
    cors:
      enabled: ${SDK_CORS_ENABLED:false}
  openapi:
    enabled: true
    title: Java Boilerplate API
    description: Read-only API for java boilerplate
    version: 1.0.0

# =========================
# JWT CONVERTER
# =========================
jwt:
  auth:
    converter:
      principle-attribute: ${JWT_PRINCIPAL_ATTRIBUTE:username}
      resource-id: java-boilerplate

# =========================
# MANAGEMENT / ACTUATOR
# =========================
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  health:
    db:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}

# =========================
# LOGGING
# =========================
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.mac.java_boilerplate: ${LOG_LEVEL_APPLICATION:INFO}
    org.springframework.kafka: ${LOG_LEVEL_KAFKA:INFO}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:WARN}
  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        environment: ${SPRING_PROFILES_ACTIVE:local}
